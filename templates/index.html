<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/left-sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modals.css') }}">
</head>
<body>
    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <div class="top-bar-left">
            <h1>Day Planner</h1>
            <button id="add-event-btn" class="btn btn-primary">+ Add Event</button>
            <button id="manage-categories-btn" class="btn btn-secondary">Manage Categories</button>
            <button id="settings-btn" class="btn btn-secondary">Settings</button>
        </div>
        <div class="top-bar-center">
            <div class="date-jump">
                <label for="jump-date">Jump to:</label>
                <input type="date" id="jump-date">
                <button id="jump-btn" class="btn btn-secondary">Go</button>
            </div>
        </div>
        <div class="top-bar-right">
            <!-- Empty for now, can be used for user settings later -->
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Left Sidebar -->
        <div class="left-sidebar">
            <!-- Sync Button -->
            <div class="left-sidebar-sync">
                <button id="manual-sync-btn" class="btn btn-secondary btn-full-width" disabled title="Enable backup/sync in settings">
                    <span class="sync-icon">⟳</span> Sync Backup
                </button>
            </div>
            
            <!-- Upcoming Events Section -->
            <div class="left-sidebar-section upcoming">
                <div class="left-sidebar-section-header">Upcoming Events</div>
                <div class="left-sidebar-section-content" id="left-sidebar-upcoming">
                    <!-- Upcoming events will be populated by JavaScript -->
                </div>
            </div>
            
            <!-- To-Dos Section -->
            <div class="left-sidebar-section todos">
                <div class="left-sidebar-section-header">To-Dos</div>
                <div class="left-sidebar-section-content" id="left-sidebar-todos">
                    <!-- To-dos will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Calendar Container -->
        <div class="calendar-container">
            <!-- Time Column (Left Side) -->
            <div class="time-column">
                <div class="time-header"></div>
                <div class="time-slots" id="time-slots">
                    <!-- Time slots will be generated by JavaScript -->
                </div>
            </div>

            <!-- Days Grid (Scrollable) -->
            <div class="days-container" id="days-container">
                <div class="days-header" id="days-header">
                    <!-- Day headers will be generated by JavaScript -->
                </div>
                <div class="days-grid" id="days-grid">
                    <!-- Day columns will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Event Modal -->
    <div id="event-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="event-modal-title">Add Event</h2>
                <span class="close" data-modal="event-modal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="event-form">
                    <input type="hidden" id="event-id">
                    
                    <div class="form-group">
                        <label for="event-name">Event Name *</label>
                        <input type="text" id="event-name" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="event-start-date">Start Date *</label>
                            <input type="date" id="event-start-date" required>
                        </div>
                        <div class="form-group">
                            <label for="event-start-time">Start Time *</label>
                            <input type="time" id="event-start-time" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="event-end-date">End Date *</label>
                            <input type="date" id="event-end-date" required>
                        </div>
                        <div class="form-group">
                            <label for="event-end-time">End Time *</label>
                            <input type="time" id="event-end-time" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="event-category">Category</label>
                        <select id="event-category">
                            <option value="">No Category</option>
                            <!-- Categories will be populated by JavaScript -->
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Notes</label>
                        <div id="notes-list">
                            <!-- Notes will be added here -->
                        </div>
                        <div class="note-actions">
                            <button type="button" class="btn btn-small" id="add-note-btn">+ Add Note</button>
                            <button type="button" class="btn btn-small" id="add-todo-btn">+ Add To-Do Item</button>
                        </div>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-modal="event-modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="category-modal-title">Add Category</h2>
                <span class="close" data-modal="category-modal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="category-form">
                    <input type="hidden" id="category-id">
                    
                    <div class="form-group">
                        <label for="category-name">Category Name *</label>
                        <input type="text" id="category-name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="category-color">Color *</label>
                        <div class="color-input-container">
                            <input type="color" id="category-color" value="#4CAF50" required>
                            <div class="color-preview-box" id="category-color-preview"></div>
                        </div>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-modal="category-modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Manage Categories Modal -->
    <div id="manage-categories-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage Categories</h2>
                <span class="close" data-modal="manage-categories-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div id="categories-list">
                    <!-- Categories will be listed here -->
                </div>
                <button type="button" class="btn btn-primary" id="add-category-from-manage">+ Add Category</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <span class="close" data-modal="settings-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="backup-sync-enabled">
                        Backup/Sync Data
                    </label>
                    <p class="setting-description">Enable automatic backup and synchronization across devices.</p>
                </div>
                
                <div class="form-group">
                    <label for="backup-location">Backup Location (Device-Specific)</label>
                    <div class="backup-location-container">
                        <input type="text" id="backup-location" placeholder="e.g., /Users/you/Dropbox/planner_backup" disabled>
                        <button type="button" class="btn btn-small" id="validate-location-btn" disabled>Validate</button>
                    </div>
                    <div id="location-status" class="location-status"></div>
                    <p class="setting-description">⚠️ This location is device-specific. Set it separately on each device to the same shared folder (e.g., Dropbox, iCloud).</p>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-modal="settings-modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="save-settings-btn">Save Settings</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Event Details Sidebar -->
    <div id="event-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Event Details</h2>
            <button class="close-sidebar" id="close-sidebar">&times;</button>
        </div>
        <div class="sidebar-content" id="sidebar-content">
            <!-- Event details will be populated here -->
        </div>
    </div>

    <!-- Overlay for modals -->
    <div id="overlay" class="overlay"></div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modals.js') }}"></script>
    <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
    <script src="{{ url_for('static', filename='js/categories.js') }}"></script>
    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/event-crud.js') }}"></script>
    <script src="{{ url_for('static', filename='js/event-renderer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/event-details.js') }}"></script>
    <script src="{{ url_for('static', filename='js/events.js') }}"></script>
    <script src="{{ url_for('static', filename='js/drag.js') }}"></script>
    <script src="{{ url_for('static', filename='js/quick-add.js') }}"></script>
    <script src="{{ url_for('static', filename='js/left-sidebar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
